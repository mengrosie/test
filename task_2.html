<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Conference Registration Form</h1>
    <form action="">
      Full Name: <br />
      <input
        type="text"
        id="fullname"
        name="fullname"
        placeholder="Enter your full name"
      /><br />

      Email Addess: <br />
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email address"
      /><br />

      Age:<br />
      <input
        type="number"
        id="age"
        name="age"
        min="18"
        max="99"
        value="18"
      /><br /><br />

      Gender:<br /><br />
      <input type="radio" id="male" name="gender" value="Male" /> Male <br />
      <input type="radio" id="female" name="gender" value="Female" /> Female
      <br /><br />

      Country of Residence: <br />
      <select name="country" id="country">
        <option value="malaysia">Malaysia</option>
        <option value="singapore">Singapore</option>
        <option value="indonesia">Indonesia</option>
      </select>
      <br /><br />

      Areas of Interest: <br />
      <input type="checkbox" name="aoi1" id="Software Development" /> Software
      Development <br />
      <input type="checkbox" name="aoi2" id="Data Science" /> Data Science
      <br />
      <input type="checkbox" name="aoi3" id="Cybersecurity" /> Cybersecurity
      <br />
      <input type="checkbox" name="aoi4" id="Artificial Intelligence" />
      Artificial Intelligence <br /><br />

      Experience Level: <br /><br />
      <input type="radio" id="beginner" name="EXPlvl" value="Beginner" />
      Beginner <br />
      <input
        type="radio"
        id="intermediate"
        name="EXPlvl"
        value="Intermediate"
      />
      Intermediate <br />
      <input type="radio" id="advanced" name="EXPlvl" value="Advanced" />
      Advanced <br /><br />

      Comments or Questions: <br />
      <textarea
        name="comments"
        id="comments"
        rows="4"
        cols="50"
        placeholder="Any comments or questions?"
      ></textarea>

      <input type="submit" value="Register" />
      <input type="reset" value="Reset" />
    </form>
  </body>
</html>
